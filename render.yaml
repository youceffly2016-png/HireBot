services:
  - type: web
    name: hirebot
    runtime: node
    plan: starter
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    disk:
      name: hirebot-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_FILE
        value: /var/data/hirebot.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://hirebot.onrender.com
      - key: OPENAI_API_KEY
        sync: false
